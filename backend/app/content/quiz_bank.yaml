# MCQ bank for the pre-session knowledge quiz (FYP objective 4). The score
# here is the knowledge baseline; the unguided capstone later measures applied
# skill. Add questions by appending more entries with a unique id.

- id: q1
  question: "Which port is most commonly associated with the insecure, unencrypted Telnet service?"
  options: ["21", "22", "23", "554"]
  answer_index: 2

- id: q2
  question: "Why is 'admin/admin' considered a security risk on an IoT camera?"
  options:
    - "It uses too much memory"
    - "It is a weak, widely-known default credential attackers try first"
    - "It slows down the boot process"
    - "It is not actually a risk"
  answer_index: 1

- id: q3
  question: "What does RTSP stand for in the context of IP cameras?"
  options:
    - "Real Time Streaming Protocol"
    - "Remote Terminal Security Protocol"
    - "Router Traffic Shaping Protocol"
    - "Rapid Transfer Session Protocol"
  answer_index: 0

- id: q4
  question: "Which OWASP IoT Top 10 category best describes an unauthenticated snapshot/image endpoint on a camera's web interface?"
  options:
    - "Insecure Ecosystem Interfaces"
    - "Physical Hardening"
    - "Lack of Device Management"
    - "Insufficient Privacy Protection"
  answer_index: 0

- id: q5
  question: "What is the main purpose of the reconnaissance phase in a penetration test?"
  options:
    - "To exploit vulnerabilities immediately"
    - "To write the final report"
    - "To discover live hosts and the services/ports they expose"
    - "To patch discovered vulnerabilities"
  answer_index: 2

- id: q6
  question: "Which of these is the strongest mitigation for insecure network services like Telnet?"
  options:
    - "Change the default wallpaper"
    - "Disable the service or replace it with an encrypted equivalent (e.g. SSH)"
    - "Rename the device"
    - "Increase the video resolution"
  answer_index: 1

- id: q7
  question: "Which OWASP IoT Top 10 weakness covers default logins like admin/admin?"
  options:
    - "Weak, guessable, or hardcoded passwords"
    - "Insecure data transfer and storage"
    - "Lack of physical hardening"
    - "Insufficient privacy protection"
  answer_index: 0

- id: q8
  question: "What is the primary security problem with using Telnet to manage a device?"
  options:
    - "It is slower than SSH"
    - "It transmits credentials and data in cleartext"
    - "It only works on Windows"
    - "It requires a paid license"
  answer_index: 1

- id: q9
  question: >
    A camera's live page requires login, but the image it embeds (/snapshot.jpg)
    loads with no login at all. What type of flaw is this?
  options:
    - "Broken/missing access control on an endpoint"
    - "A buffer overflow"
    - "A denial-of-service"
    - "SQL injection"
  answer_index: 0

- id: q10
  question: >
    Reading the version string a service reveals about itself (e.g. an RTSP
    'Server:' header) is called banner grabbing. Why does it matter to an assessor?
  options:
    - "It speeds up the network"
    - "It reveals the software/version so known CVEs can be looked up"
    - "It encrypts the connection"
    - "It resets the device password"
  answer_index: 1

- id: q11
  question: >
    A web panel gives everyone the same fixed session cookie value, with no
    expiry and no signing. Why is that a weakness?
  options:
    - "It uses too much bandwidth"
    - "Anyone can forge or reuse the cookie to bypass the login"
    - "It logs the user out too often"
    - "It makes pages load slowly"
  answer_index: 1

- id: q12
  question: >
    Most weaknesses found on the camera came from how it shipped: default
    passwords, services left on, missing auth checks. What best prevents this
    whole class of issue?
  options:
    - "Buy a bigger hard drive"
    - "Harden the device's default configuration before deployment"
    - "Increase the video resolution"
    - "Rename the device"
  answer_index: 1
