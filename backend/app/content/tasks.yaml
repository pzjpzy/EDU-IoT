# The guided "room": an ordered list of HTB/TryHackMe-style tasks. Students
# use their own tools (nmap, a browser, a telnet client, netcat/ncat) against
# the session's target IP. Each task is completed one of two ways:
#   - type: auto   -> the target itself self-reports the triggering event
#                     (see target/app/events.py), polled via check_event.
#   - type: submit -> the student types an answer/flag, checked against
#                     `answer` (case-insensitive, whitespace-trimmed).
#
# `requires` lists the target profile flags (see target/app/vuln_config.py
# and backend/app/services/target_profile.py) that must ALL be true for a
# task to apply to a given session's target at all - this is what lets the
# same room adapt to a partially-hardened target (fewer/different weaknesses
# present) instead of assuming every weakness always exists. An empty list
# means the task always applies. Task numbering ("Task N - ...") is added
# dynamically based on position in the FILTERED list, not written here,
# since the filtered set (and therefore the numbering) differs per target.
#
# Tasks unlock strictly in order within the filtered set. owasp_id/
# finding_title/severity/evidence feed directly into the session's findings
# list and the final PDF report.

- id: recon-telnet-port
  title: "Find the exposed services"
  type: submit
  requires: [telnet_enabled]
  concept: >
    Reconnaissance is the first phase of any penetration test: before you can
    assess a device you have to find out what it exposes. Port scanning sends
    connection probes to a range of TCP ports and notes which ones respond,
    revealing the services running on the target. The automated scan you just
    ran did exactly this - now you'll reproduce one finding by hand so you
    understand what the tool did on your behalf.
  prompt: >
    Use Nmap (or any port scanner) against the target IP to discover open
    TCP ports. What port number is the insecure Telnet service running on?
  hint: "Try: nmap -sT --top-ports 100 <target-ip>. Telnet's well-known port is a two-digit number."
  answer: ["23"]
  owasp_id: I2
  finding_title: "Telnet (unencrypted remote administration) is exposed"
  severity: Medium
  evidence: "Confirmed by the student via port scan: 23/tcp open."

- id: recon-rtsp-port
  title: "Identify the video streaming service"
  type: submit
  requires: [rtsp_enabled]
  concept: >
    IP cameras deliver their live video with a streaming protocol. RTSP (Real
    Time Streaming Protocol) is the classic one, and it runs unencrypted by
    default. Knowing which port carries the video stream tells an assessor
    where the feed could be intercepted or accessed without authorisation.
  prompt: >
    Looking at your scan results, which port is the RTSP-style video
    streaming service running on?
  hint: "RTSP's well-known port is 554."
  answer: ["554"]
  owasp_id: I2
  finding_title: "RTSP video streaming service is exposed unencrypted"
  severity: Medium
  evidence: "Confirmed by the student via port scan: 554/tcp open."

- id: web-enum-login
  title: "Enumerate the web admin interface"
  type: submit
  requires: []
  concept: >
    Enumeration means mapping out an interface's structure - its pages,
    endpoints, and entry points - before attacking it. The web admin panel is
    the richest attack surface on most cameras, so finding the login page is
    the doorway to everything that follows: credential attacks, unauthenticated
    endpoints, and session handling.
  prompt: >
    Browse to http://<target-ip>/ in your browser. What is the path of the
    admin login page?
  hint: "The root path redirects you straight there."
  answer: ["/login", "login"]
  owasp_id: I3
  finding_title: "Web-based admin/ecosystem interface is reachable"
  severity: Low
  evidence: "Confirmed by the student: admin login page found at /login."

- id: http-default-creds
  title: "Log in with default credentials"
  type: auto
  requires: [http_default_creds_vulnerable]
  check_event: http_default_login
  concept: >
    Default credentials (admin/admin and friends) are the single most common
    IoT weakness - OWASP IoT #1. Manufacturers ship devices with well-known
    logins and users rarely change them, so an attacker can simply look up the
    default and walk in. This is why the OWASP top weakness is "weak, guessable,
    or hardcoded passwords". When you log in successfully, the target reports it
    and this step completes on its own.
  prompt: >
    Try common default credentials (e.g. admin/admin) on the web admin
    login page. Once you log in successfully, this step updates
    automatically - no need to submit anything.
  hint: "Think of the single most commonly used default admin password of all time."
  owasp_id: I1
  finding_title: "Default credentials accepted on the web admin panel"
  severity: High
  evidence: "The target reported a successful login using default credentials."

- id: http-flag
  title: "Retrieve the flag from the live feed"
  type: submit
  requires: [http_default_creds_vulnerable]
  concept: >
    Capturing a "flag" is how CTF-style labs prove you actually reached
    protected content, not just guessed. Here the flag sits on the
    authenticated live-feed page, so retrieving it demonstrates the concrete
    impact of the default-credential weakness: full access to the camera's
    video the moment the login falls.
  prompt: >
    Now that you're logged in, find the flag shown on the live camera feed
    page and submit it here.
  hint: "It's printed right there on /live, in the form EDUVAPT{...}."
  answer: ["EDUVAPT{d3f4ult_cr3d5_4r3_d4ng3r0us}"]
  owasp_id: I1
  finding_title: "Default credentials confirmed via live-feed flag"
  severity: High
  evidence: "Student retrieved the flag embedded on the authenticated /live page."

- id: unauth-snapshot
  title: "Bypass authentication on the snapshot endpoint"
  type: auto
  requires: [snapshot_unauth_vulnerable]
  check_event: unauth_snapshot_access
  concept: >
    Broken authorisation happens when one endpoint forgets to check the login
    that its neighbours enforce. The live page checks your session, but the
    image it embeds does not - so the video snapshot is reachable with no login
    at all. This is an insecure ecosystem interface (OWASP IoT #3): the feed
    leaks even though the "front door" looks locked.
  prompt: >
    Without logging in (try a private/incognito browser window), browse
    directly to http://<target-ip>/snapshot.jpg. If the image loads without
    ever authenticating, this step updates automatically.
  hint: "Not every endpoint that looks 'inside' a login-protected app actually checks for a session."
  owasp_id: I3
  finding_title: "Live camera feed accessible without any authentication"
  severity: High
  evidence: "The target reported that /snapshot.jpg was accessed without a valid session."

- id: telnet-default-creds
  title: "Log into the Telnet service"
  type: auto
  requires: [telnet_default_creds_vulnerable]
  check_event: telnet_default_login
  concept: >
    The same default-credential weakness often exists on more than one service.
    Telnet is worse than the web panel because it is also unencrypted, so the
    password crosses the network in cleartext. Reusing default logins across an
    insecure protocol is a textbook example of why legacy services should be
    disabled entirely.
  prompt: >
    Connect to port 23 with a Telnet/raw TCP client (e.g. PuTTY, ncat,
    telnet) and try default credentials. This step updates automatically
    once you're logged in.
  hint: "Same idea as the web panel - try the obvious defaults."
  owasp_id: I1
  finding_title: "Default credentials accepted on the Telnet service"
  severity: High
  evidence: "The target reported a successful Telnet login using default credentials."

- id: telnet-flag
  title: "Submit the Telnet flag"
  type: submit
  requires: [telnet_default_creds_vulnerable]
  concept: >
    As with the web flag, capturing the Telnet flag proves you truly obtained
    an interactive session on the device - the level of access from which an
    attacker could change settings, pivot, or disable the camera.
  prompt: >
    The Telnet CLI shows a flag once you log in. Submit it here.
  hint: "Look right after 'Welcome to IoT-Cam CLI'."
  answer: ["EDUVAPT{t3ln3t_d3f4ult_cr3d5}"]
  owasp_id: I1
  finding_title: "Default credentials confirmed via Telnet flag"
  severity: High
  evidence: "Student retrieved the flag shown after a successful Telnet login."

- id: rtsp-banner
  title: "Identify the RTSP server software"
  type: submit
  requires: [rtsp_enabled]
  concept: >
    Banner grabbing reads the identifying string a service volunteers about
    itself - its product name and often version. That fingerprint lets an
    assessor look up known vulnerabilities (CVEs) for that exact software.
    Exposing detailed version banners maps to OWASP IoT #5, "use of insecure or
    outdated components", because it hands attackers the information they need
    to find a matching exploit.
  prompt: >
    Connect to port 554 directly (e.g. with ncat) and send a bare RTSP
    OPTIONS request. What does the 'Server:' header say (product name only)?
  hint: 'Try: printf "OPTIONS rtsp://<ip>:554/ RTSP/1.0\r\nCSeq: 1\r\n\r\n" | ncat <ip> 554'
  answer: ["IoT-Cam-RTSP", "IoT-Cam-RTSP/1.0"]
  owasp_id: I5
  finding_title: "Service software identified via banner grabbing"
  severity: Low
  evidence: "Student identified the RTSP service banner: IoT-Cam-RTSP/1.0."

- id: pattern-recognition
  title: "Recognise the pattern"
  type: auto
  requires: []
  check_event: __all_previous_complete__
  concept: >
    Step back and notice the common thread: nearly every weakness you found
    came from insecure defaults - default passwords, services left on, missing
    auth checks that shipped that way. That's OWASP IoT #9, "insecure default
    settings", and recognising this pattern is the real takeaway: harden the
    defaults and most of the individual findings disappear at once.
  prompt: >
    You've now found the weaknesses this target actually has. This step
    completes automatically once you've finished the tasks above.
  owasp_id: I9
  finding_title: "Device exposes network services with no visible hardening by default"
  severity: Low
  evidence: "Every prior finding in this session stemmed from insecure default settings."
